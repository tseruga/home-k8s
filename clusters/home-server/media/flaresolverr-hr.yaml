---
apiVersion: helm.toolkit.fluxcd.io/v2beta1
kind: HelmRelease
metadata:
  name: flaresolverr
  namespace: media
spec:
  chart:
    spec:
      chart: flaresolverr
      reconcileStrategy: ChartVersion
      sourceRef:
        kind: HelmRepository
        name: k8s-at-home
      version: 5.4.2
  interval: 1m0s
  values:
    image:
      repository: ghcr.io/flaresolverr/flaresolverr
      tag: v3.5.2
    env:
      TZ: America/Chicago
      LOG_LEVEL: info
    service:
      main:
        type: ClusterIP
        ports:
          http:
            port: 8191
    probes:
      liveness:
        enabled: true
      readiness:
        enabled: true
      startup:
        enabled: true
